# Exported from Render on 2024-05-03T06:25:00Z
services:
  - type: web
    name: RoomMateCharacter
    runtime: ruby
    repo: https://github.com/gipsycloud/flat_character
    plan: free
    envVars:
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: enabled
        sync: false
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
        sync: false
    region: singapore
    buildCommand:
      bundle install; npm install; bundle exec rake db:prepare; bundle exec rake assets:precompile;
      bundle exec rake assets:clean;
    startCommand: bundle exec puma -C config/puma.rb -p ${PORT} -e ${RAILS_ENV:-production}
    # domains:
      # - matecharacter.zwewintmann.com
    pullRequestPreviewsEnabled: true

# Exported from Render on 2025-08-26T06:03:58Z
databases:
  - name: flatmate
    databaseName: roommatecharacter_db_xf5o
    user: roommatecharacter_user
    plan: free
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    postgresMajorVersion: "16"
version: "1"
